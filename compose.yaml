services:
  postgres:
    image: postgres:17
    container_name: vivuviet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vivuviet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vivuviet_dev}
      POSTGRES_DB: vivuviet
    ports:
      - "5433:5432"
    volumes:
      - vivuviet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vivuviet_pgdata: